# KEPT alerts on Telegram (scripts/alerts): every 3 minutes, posts due dates, verdicts, burns,
# launcher alerts and the weekly report, and answers the bot's commands.
#
# GitHub's scheduler drops most runs of a frequent schedule, so once the bot token is set, one run
# loops for about five and a half hours and then starts the next run itself (a run started this way
# is never dropped). The schedule is only a backstop; the daily health job also restarts the chain.
# Actions minutes are free for a public repository.
#
# Setup (see scripts/alerts/README.md):
#   secret    TELEGRAM_BOT_TOKEN     from @BotFather
#   variable  TELEGRAM_CHANNEL       e.g. @keptalerts (the bot is an admin of it)
#   variable  TELEGRAM_BOT_USERNAME  e.g. keptalerts_bot
# Telegram's API is free, so this costs nothing.

name: KEPT alerts

on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:

concurrency:
  group: kept-alerts
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: scripts/alerts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/alerts/package-lock.json

      - run: npm ci --no-audit --no-fund

      # what has been sent and who follows what, carried from run to run
      - name: Restore alerts memory
        uses: actions/cache/restore@v4
        with:
          path: scripts/alerts/.state.json
          key: alerts-state-${{ github.run_id }}
          restore-keys: alerts-state-

      - name: Send alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # optional: funding warnings on new IMD launches (Blockscout's API for Robinhood Chain)
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
          TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "TELEGRAM_BOT_TOKEN is not set: one dry run."; node alerts.mjs --dry; exit 0; fi
          end=$((SECONDS + 5 * 3600 + 20 * 60))
          while [ $SECONDS -lt $end ]; do
            node alerts.mjs || echo "pass failed; the next one retries"
            sleep 180
          done

      - name: Start the next run
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}
        working-directory: .
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then echo "no bot token: no chain"; exit 0; fi
          gh workflow run alerts.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Save alerts memory
        if: always() && hashFiles('scripts/alerts/.state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: scripts/alerts/.state.json
          key: alerts-state-${{ github.run_id }}
