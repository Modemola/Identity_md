# KEPT launcher records: reads new vibe/vibe launches, trades and graduations, and the launcher
# wallets' transfers on IMD launches on Robinhood Chain mainnet, and publishes both indexes to the
# `data` branch, where /api/record reads them. Vercel ignores that branch.
#
# GitHub's scheduler drops most runs of a frequent schedule, so one run loops for about five and a
# half hours, one pass an hour, then starts the next run itself (a run started this way is never
# dropped). The schedule is only a backstop that restarts the chain if it ever breaks; the health
# job (health.yml, every six hours) restarts it too. Actions minutes are free for a public repository.
name: records

on:
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: records
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
      - name: Check out the data branch
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" data >/dev/null; then
            git clone --depth 1 --branch data "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" data
          else
            mkdir data && cd data && git init -b data && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Index and publish every hour
        env:
          # optional: IMD funding groups on mainnet (a free key from dev.blockscout.com)
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
        run: |
          end=$((SECONDS + 5 * 3600 + 20 * 60))
          while :; do
            started=$SECONDS
            bash code/scripts/records/publish.sh || echo "pass failed; the next one retries"
            [ $((SECONDS + 3600)) -lt $end ] || break
            sleep $((3600 - (SECONDS - started) > 60 ? 3600 - (SECONDS - started) : 60))
          done
      - name: Start the next run
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run records.yml --repo "$GITHUB_REPOSITORY" --ref main
