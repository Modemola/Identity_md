# KEPT verdict bot: every 10 minutes, posts any newly settled milestone to X with its card.
#
# Setup: add four repository secrets (Settings > Secrets and variables > Actions):
#   X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN, X_ACCESS_SECRET
# Without them the bot still runs, but only as a dry run: it posts nothing.
#
# To post past verdicts once, run this workflow by hand (Actions > KEPT verdict bot > Run workflow)
# and give a start block, e.g. 93300000 for pledge #1.

name: KEPT verdict bot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      since:
        description: "Start from this block (leave empty to continue where the last run stopped)"
        required: false
        default: ""

# one run at a time, so two runs never post the same verdict
concurrency:
  group: verdict-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: scripts/verdict-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/verdict-bot/package-lock.json

      - run: npm ci --no-audit --no-fund

      # what the bot has already posted, carried from run to run
      - name: Restore bot memory
        uses: actions/cache/restore@v4
        with:
          path: scripts/verdict-bot/.state.json
          key: verdict-state-${{ github.run_id }}
          restore-keys: verdict-state-

      - name: Check the vault and post
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          SINCE: ${{ inputs.since }}
        run: |
          args="--once"
          if [ -n "$X_API_KEY" ]; then args="$args --post"; else echo "No X keys set: dry run, nothing is posted."; fi
          if [ -n "$SINCE" ]; then
            case "$SINCE" in (*[!0-9]*) echo "since must be a block number"; exit 1;; esac
            args="$args --since $SINCE"
          fi
          node bot.mjs $args

      # saved even when posting failed part way, so whatever did post is never posted again
      - name: Save bot memory
        if: always() && hashFiles('scripts/verdict-bot/.state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: scripts/verdict-bot/.state.json
          key: verdict-state-${{ github.run_id }}
